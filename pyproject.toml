[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devmind"
version = "0.1.0"
description = "DevMind Focus — Ruthless deep-work daemon & gamified dashboard"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "psutil>=5.9.0",
    "ecdsa>=0.18.0",
    "rich>=13.0.0",
    "pygame>=2.5.0"
]

[project.scripts]
devmind = "devmind.cli:cli"

[tool.setuptools]
packages = ["devmind"]
